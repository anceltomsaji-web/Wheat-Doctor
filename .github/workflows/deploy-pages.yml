name: Deploy Standalone PWA to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 & Build Static PWA Bundle
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Build Static Bundle (dist/)
        run: |
          pip install -r requirements.txt
          python build_android_bundle.py

      - name: 4. Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 5. Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 6. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
