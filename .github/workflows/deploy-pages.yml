name: Deploy Standalone PWA to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 & Build Static PWA Bundle
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Build Static Bundle (dist/)
        run: |
          pip install -r requirements.txt
          python build_android_bundle.py

      - name: 4. Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

