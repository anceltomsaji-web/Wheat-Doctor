name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Signed Wheat Doctor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies & Verify AI Vision Engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python build_android_bundle.py
          python verify_wheat_validation.py

      - name: 4. Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 6. Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 7. Compile & Sign Android APK (Release & Debug)
        working-directory: ./android
        run: |
          gradle assembleRelease assembleDebug --no-daemon --stacktrace

      - name: 8. Prepare Installable APK Files
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/release/app-release.apk release-apk/Wheat-Doctor-v2.0-Android.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Wheat-Doctor-v2.0-Debug.apk
          ls -lh release-apk/

      - name: 9. Upload Installable Android APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wheat-Doctor-Android-APK
          path: release-apk/Wheat-Doctor-v2.0-Android.apk
          if-no-files-found: error

      - name: 10. Publish Android APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Wheat Doctor AI v2.0.0 — Android Application (APK)"
          body: |
            ## 🌾 Wheat Doctor AI v2.0.0 — Official Android Application
            ### 📲 How to Install on Your Android Phone:
            1. Tap **`Wheat-Doctor-v2.0-Android.apk`** below under **Assets** to download the installer onto your Android phone.
            2. Open the downloaded `.apk` file and tap **Install** (if prompted, allow *Install from this source*).
            3. Launch **Wheat Doctor** from your app drawer — works **100% offline** in wheat fields!

            ### ✨ Features Included:
            - **Poaceae Monocot Morphological Validator**: Rejects non-plant objects and broadleaf dicot crops automatically.
            - **5-Class Wheat Pathology Classifier**: Healthy Wheat, Yellow/Stripe Rust (*P. striiformis*), Brown/Leaf Rust (*P. triticina*), Powdery Mildew (*B. graminis*), and Septoria Leaf Blotch (*Z. tritici*).
            - **Glowing RGBA Lesion Heatmaps**: Real-time Gaussian-blurred overlay isolating fungal urediniospores and necrotic blotches.
            - **12 Indian Languages & Native Android Voice Narration**: Hindi, Punjabi, English, Marathi, Bengali, Gujarati, Telugu, Tamil, Kannada, Malayalam, Urdu, and Odia.
          files: |
            release-apk/Wheat-Doctor-v2.0-Android.apk
            release-apk/Wheat-Doctor-v2.0-Debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
